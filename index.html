<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell" aria-label="Snake game">
  <aside class="leaderboard-panel" aria-label="Top scores">
    <div id="leaderboard">
      <h2>Top 10</h2>
      <table id="lbTable"></table>
    </div>
  </aside>

  <section class="board-panel" aria-label="Game field">
    <canvas id="game" width="400" height="400"></canvas>
  </section>

  <aside id="panel" class="control-panel" aria-label="Game controls">
    <div class="panel-header">
      <h1 id="panelTitle">Snake</h1>
      <p id="statusText">Use arrow keys or WASD to steer</p>
    </div>

    <div id="info" class="score-grid">
      <div class="score-item">
        <span class="score-label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-item">
        <span class="score-label">High Score</span>
        <strong id="highScore">0</strong>
      </div>
    </div>

    <button id="startBtn" type="button">Start Game</button>

    <div id="gameOverSection">
      <p id="finalScore"></p>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="16" autocomplete="off">
      <button id="saveBtn" type="button">Save Result</button>
    </div>

    <div class="controls-help" aria-label="Keyboard controls">
      <div><kbd>Left</kbd><kbd>A</kbd><span>Turn left</span></div>
      <div><kbd>Right</kbd><kbd>D</kbd><span>Turn right</span></div>
      <div><kbd>Up</kbd><kbd>W</kbd><span>Speed up</span></div>
      <div><kbd>Down</kbd><kbd>S</kbd><span>Slow down</span></div>
    </div>
  </aside>
</main>

<script src="game.js"></script>
</body>
</html>
